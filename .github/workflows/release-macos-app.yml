# Reusable: build, sign with Developer ID, notarize, staple, zip, and attach to a GitHub Release.
#
# Call it from a tag push (vX.Y.Z) in an app repo. The app repo's build command must produce a
# signed .app at `app-path`, signing with the identity passed in $SIGN_IDENTITY (a SHA-1 hash)
# and using --options runtime --timestamp. It also gets $BUILD (the run number) and $UNIVERSAL=1.
#
#   jobs:
#     release:
#       uses: hananiah-linde/homebrew-tap/.github/workflows/release-macos-app.yml@main
#       permissions:
#         contents: write
#       with:
#         app-name: MyApp
#       secrets:
#         DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
#         DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
#         # Notarization: either an App Store Connect API key...
#         NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
#         NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
#         NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
#         # ...or an Apple ID with an app-specific password (used when NOTARY_API_KEY is empty).
#         APPLE_ID: ${{ secrets.APPLE_ID }}
#         APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
#         APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
name: Release macOS app

on:
  workflow_call:
    inputs:
      app-name:
        description: App name, e.g. Awake. The zip is named <app-name>-<version>.zip.
        required: true
        type: string
      app-path:
        description: Path to the built .app. Defaults to dist/<app-name>.app.
        required: false
        type: string
        default: ""
      build-command:
        description: Command that builds and signs the .app.
        required: false
        type: string
        default: ./scripts/build-app.sh
      version-file:
        description: File whose contents must match the tag (without the leading v). Empty to skip.
        required: false
        type: string
        default: VERSION
      runs-on:
        required: false
        type: string
        default: macos-15
    secrets:
      DEVELOPER_ID_P12_BASE64:
        description: Base64 of a .p12 export of the Developer ID Application certificate and its private key.
        required: true
      DEVELOPER_ID_P12_PASSWORD:
        required: true
      NOTARY_API_KEY:
        description: Contents of the App Store Connect API key (AuthKey_XXXX.p8). Takes precedence over APPLE_ID.
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_ISSUER_ID:
        required: false
      APPLE_ID:
        description: Apple ID email, used for notarization when NOTARY_API_KEY isn't set.
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        description: App-specific password from account.apple.com.
        required: false
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
      sha256:
        value: ${{ jobs.release.outputs.sha256 }}
      asset-name:
        value: ${{ jobs.release.outputs.asset-name }}
      download-url:
        value: ${{ jobs.release.outputs.download-url }}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      asset-name: ${{ steps.package.outputs.asset-name }}
      download-url: ${{ steps.publish.outputs.download-url }}
    env:
      APP_NAME: ${{ inputs.app-name }}
      APP_PATH: ${{ inputs.app-path != '' && inputs.app-path || format('dist/{0}.app', inputs.app-name) }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version from tag
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) echo "::error::Run this from a vX.Y.Z tag push (got $GITHUB_REF)"; exit 1 ;;
          esac
          if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            FILE_VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION doesn't match $VERSION_FILE ($FILE_VERSION)"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # The intermediate isn't always on the runner, and codesign needs the full chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid Developer ID Application identity in DEVELOPER_ID_P12_BASE64"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          SIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
          BUILD: ${{ github.run_number }}
          UNIVERSAL: "1"
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          swift --version
          eval "$BUILD_COMMAND"
          codesign --verify --strict --deep --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "Authority=Developer ID Application|flags=.*runtime" \
            || { echo "::error::$APP_PATH isn't signed with Developer ID + hardened runtime"; exit 1; }

      - name: Notarize and staple
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$NOTARY_API_KEY" ]; then
            if [ -z "$NOTARY_API_KEY_ID" ] || [ -z "$NOTARY_API_ISSUER_ID" ]; then
              echo "::error::NOTARY_API_KEY is set but NOTARY_API_KEY_ID or NOTARY_API_ISSUER_ID is missing"
              exit 1
            fi
            echo "Notarizing with App Store Connect API key"
            printf '%s\n' "$NOTARY_API_KEY" > "$KEY_FILE"
            AUTH=(--key "$KEY_FILE" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "Notarizing with Apple ID"
            AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          else
            echo "::error::Set NOTARY_API_KEY/_KEY_ID/_ISSUER_ID, or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"

          STATUS="$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")"
          SUBMISSION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: ${STATUS:-unknown}"
            [ -n "$SUBMISSION_ID" ] && xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}"
            exit 1
          fi
          rm -f "$KEY_FILE"

          # Fetching the ticket from Apple's CDN right after notarization is flaky; retry.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP_PATH"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Stapling failed after $attempt attempts"
              exit 1
            fi
            echo "Stapling failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="$APP_NAME-$VERSION.zip"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/$ASSET"
          SHA256="$(shasum -a 256 "release/$ASSET" | awk '{ print $1 }')"
          echo "asset-name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ASSET sha256: $SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset-name }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "release/$ASSET" --clobber
          else
            gh release create "$TAG" "release/$ASSET" --title "$APP_NAME $VERSION" --generate-notes --verify-tag
          fi
          echo "download-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
